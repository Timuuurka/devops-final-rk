name: CI-CD

on:
  push:
    branches: [ "develop", "main" ]

permissions:
  contents: read
  packages: write

jobs:
  #######################
  # 1. TESTS
  #######################
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  #######################
  # 2. BUILD & PUSH IMAGE
  #######################
  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker tag
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "TAG=staging-latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=prod-latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/timuuurka/devops-final-rk:${{ steps.vars.outputs.TAG }}

  #######################
  # 3. DEPLOY STAGING
  #######################
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref_name == 'develop'
    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/kali_key
          chmod 600 ~/.ssh/kali_key

      - name: Upload docker-compose (staging)
        run: |
          ssh -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ~/devops-final-rk/staging"

          scp -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            docker-compose.staging.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/devops-final-rk/staging/docker-compose.yml

      - name: Deploy to STAGING (Kali)
        run: |
          ssh -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e; \
             cd ~/devops-final-rk/staging; \
             echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin; \
             docker compose pull; \
             docker compose up -d; \
             docker compose ps"

  #######################
  # 4. DEPLOY PRODUCTION
  #######################
  deploy_prod:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref_name == 'main'
    environment: production
    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/kali_key
          chmod 600 ~/.ssh/kali_key

      - name: Upload docker-compose (prod)
        run: |
          ssh -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ~/devops-final-rk/prod"

          scp -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/devops-final-rk/prod/docker-compose.yml

      - name: Deploy to PRODUCTION (Kali)
        run: |
          ssh -i ~/.ssh/kali_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e; \
             cd ~/devops-final-rk/prod; \
             echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin; \
             docker compose pull; \
             docker compose up -d; \
             docker compose ps"
